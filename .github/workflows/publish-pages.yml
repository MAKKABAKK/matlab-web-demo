name: Publish projects and GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "projects/**"
      - "publisher/**"
      - "tests/**"
      - "docs/**"
      - ".github/workflows/publish-pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "projects/**"
      - "publisher/**"
      - "tests/**"
      - "docs/**"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:

concurrency:
  group: publish-pages
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"

      - name: Build generated website content
        run: python -m publisher.build --repository-root .

      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Check JavaScript syntax
        run: |
          node --check docs/js/content-utils.js
          node --check docs/js/markdown.js
          node --check docs/js/navigation-utils.js
          node --check docs/js/app.js

      - name: Run Node tests
        run: node --test tests/*.test.js

      - name: Run HTTP smoke test
        run: python tests/http_smoke.py

      - name: Upload generated content
        if: github.event_name == 'push'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: generated-content
          path: docs/content
          if-no-files-found: error
          retention-days: 1

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  persist-generated-content:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download generated content
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: generated-content
          path: generated-content

      - name: Refuse to overwrite a newer main branch
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ github.sha }}"

      - name: Apply generated content only
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          target = Path("docs/content")
          source = Path("generated-content")
          if not (source / "catalog.json").is_file():
              raise SystemExit("Generated content artifact is incomplete.")
          shutil.rmtree(target)
          shutil.copytree(source, target)
          PY

      - name: Commit generated content when changed
        run: |
          if test -z "$(git status --porcelain -- docs/content)"; then
            echo "Generated content is already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/content/catalog.json docs/content/projects
          git commit -m "chore(publisher): update generated website content [skip ci]"
          git push origin HEAD:main

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-test, persist-generated-content]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy tested Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
